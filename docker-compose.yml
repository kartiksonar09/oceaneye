services:

  postgres:
    image: postgis/postgis:16-3.4
    container_name: oceaneeye-postgres
    environment:
      POSTGRES_DB: oceaneeye
      POSTGRES_USER: oceaneeye
      POSTGRES_PASSWORD: oceaneeye
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    container_name: oceaneeye-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  minio:
    image: quay.io/minio/minio
    container_name: oceaneeye-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: oceaneeye
      MINIO_ROOT_PASSWORD: oceaneeye123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  mongo_data:
  minio_data: